project.ext {
    // ExoPlayer version and version code.
    releaseVersion = '2.19.0'
    releaseVersionCode = 2_019_000
    minSdkVersion = 16
    appTargetSdkVersion = 33
    // API version before restricting local file access.
    // https://developer.android.com/training/data-storage/app-specific
    mainDemoAppTargetSdkVersion = 29
    // Upgrading this requires [Internal ref: b/193254928] to be fixed, or some
    // additional robolectric config.
    targetSdkVersion = 30
    compileSdkVersion = 33
    dexmakerVersion = '2.28.3'
    junitVersion = '4.13.2'
    // Use the same Guava version as the Android repo:
    // https://cs.android.com/android/platform/superproject/+/master:external/guava/METADATA
    guavaVersion = '31.1-android'
    mockitoVersion = '3.12.4'
    robolectricVersion = '4.8.1'
    // Keep this in sync with Google's internal Checker Framework version.
    checkerframeworkVersion = '3.13.0'
    checkerframeworkCompatVersion = '2.5.5'
    errorProneVersion = '2.18.0'
    jsr305Version = '3.0.2'
    kotlinAnnotationsVersion = '1.8.20'
    // Updating this to 1.4.0+ will import Kotlin stdlib [internal ref: b/277891049].
    androidxAnnotationVersion = '1.3.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCollectionVersion = '1.2.0'
    androidxConstraintLayoutVersion = '2.1.4'
    // Updating this to 1.9.0+ will import Kotlin stdlib [internal ref: b/277891049].
    androidxCoreVersion = '1.8.0'
    androidxFuturesVersion = '1.1.0'
    androidxMediaVersion = '1.6.0'
    androidxMedia2Version = '1.2.1'
    androidxMultidexVersion = '2.0.1'
    androidxRecyclerViewVersion = '1.3.0'
    androidxMaterialVersion = '1.8.0'
    androidxTestCoreVersion = '1.5.0'
    androidxTestJUnitVersion = '1.1.5'
    androidxTestRunnerVersion = '1.5.2'
    androidxTestRulesVersion = '1.5.0'
    androidxTestServicesStorageVersion = '1.4.2'
    androidxTestTruthVersion = '1.5.0'
    truthVersion = '1.1.3'
    okhttpVersion = '4.11.0'
    modulePrefix = ':'
    if (gradle.ext.has('exoplayerModulePrefix')) {
        modulePrefix += gradle.ext.exoplayerModulePrefix
    }

    moduleNamespaces = [
        // extensions (libs)
        ':exoplayer-extension-av1'         : 'com.google.android.exoplayer2.ext.av1',
        ':exoplayer-extension-cast'        : 'com.google.android.exoplayer2.ext.cast',
        ':exoplayer-extension-cronet'      : 'com.google.android.exoplayer2.ext.cronet',
        ':exoplayer-extension-ffmpeg'      : 'com.google.android.exoplayer2.ext.ffmpeg',
        ':exoplayer-extension-flac'        : 'com.google.android.exoplayer2.ext.flac',
        ':exoplayer-extension-ima'         : 'com.google.android.exoplayer2.ext.ima',
        ':exoplayer-extension-leanback'    : 'com.google.android.exoplayer2.ext.leanback',
        ':exoplayer-extension-media2'      : 'com.google.android.exoplayer2.ext.media2',
        ':exoplayer-extension-mediasession': 'com.google.android.exoplayer2.ext.mediasession',
        ':exoplayer-extension-okhttp'      : 'com.google.android.exoplayer2.ext.okhttp',
        ':exoplayer-extension-opus'        : 'com.google.android.exoplayer2.ext.opus',
        ':exoplayer-extension-rtmp'        : 'com.google.android.exoplayer2.ext.rtmp',
        ':exoplayer-extension-vp9'         : 'com.google.android.exoplayer2.ext.vp9',
        ':exoplayer-extension-workmanager' : 'com.google.android.exoplayer2.ext.workmanager',

        // libraries (libs)
        ':exoplayer-library'                : 'com.google.android.exoplayer2.library',
        ':exoplayer-library-common'         : 'com.google.android.exoplayer2.common',
        ':exoplayer-library-container'      : 'com.google.android.exoplayer2.container',
        ':exoplayer-library-core'           : 'com.google.android.exoplayer2.core',
        ':exoplayer-library-dash'           : 'com.google.android.exoplayer2.source.dash',
        ':exoplayer-library-database'       : 'com.google.android.exoplayer2.database',
        ':exoplayer-library-datasource'     : 'com.google.android.exoplayer2.upstream',
        ':exoplayer-library-decoder'        : 'com.google.android.exoplayer2.decoder',
        ':exoplayer-library-effect'         : 'com.google.android.exoplayer2.effect',
        ':exoplayer-library-extractor'      : 'com.google.android.exoplayer2.extractor',
        ':exoplayer-library-hls'            : 'com.google.android.exoplayer2.source.hls',
        ':exoplayer-library-muxer'          : 'com.google.android.exoplayer2.muxer',
        ':exoplayer-library-rtsp'           : 'com.google.android.exoplayer2.rtsp',
        ':exoplayer-library-smoothstreaming': 'com.google.android.exoplayer2.source.smoothstreaming',
        ':exoplayer-library-transformer'    : 'com.google.android.exoplayer2.transformer',
        ':exoplayer-library-ui'             : 'com.google.android.exoplayer2.ui',

        // test/support modules
        ':exoplayer-playbacktests'      : 'com.google.android.exoplayer2.playbacktests',
        ':exoplayer-robolectricutils'   : 'com.google.android.exoplayer2.robolectricutils',
        ':exoplayer-testutils'          : 'com.google.android.exoplayer2.testutil',
        ':exoplayer-testdata'           : 'com.google.android.exoplayer2.testdata', // if this is Android; ignore if pure JVM
    ]
}
